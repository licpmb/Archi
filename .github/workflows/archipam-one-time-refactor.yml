name: One-time Archipam security refactor

on:
  push:
    branches:
      - security/archipam-hardening

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: archify/package-lock.json

      - name: Rename product and apply security hardening
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          binary_ext = {'.png','.jpg','.jpeg','.gif','.webm','.ico','.zip','.woff','.woff2','.ttf','.otf','.pdf'}
          special = [
              ('@tt-a1i/archify-dsh','@licpmb/archipam-dsh'),
              ('https://github.com/tt-a1i/archify.git','https://github.com/licpmb/Archi.git'),
              ('https://github.com/tt-a1i/archify','https://github.com/licpmb/Archi'),
              ('https://tt-a1i.github.io/archify','https://licpmb.github.io/Archi'),
              ('tt-a1i/archify','licpmb/Archi'),
          ]
          replacements = [('ARCHIFY','ARCHIPAM'),('Archify','Archipam'),('archify','archipam')]

          # Rename textual product identifiers, CLI names, env vars, docs and contracts.
          for p in list(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_ext:
                  continue
              try:
                  s = p.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              old = s
              for a, b in special:
                  s = s.replace(a, b)
              for a, b in replacements:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s, 'utf-8')

          # Rename every path containing the old product name, deepest first.
          items = [p for p in root.rglob('*') if '.git' not in p.parts and 'archify' in p.name.lower()]
          for p in sorted(items, key=lambda x: len(x.parts), reverse=True):
              if not p.exists():
                  continue
              newname = p.name.replace('ARCHIFY','ARCHIPAM').replace('Archify','Archipam').replace('archify','archipam')
              if newname != p.name:
                  p.rename(p.with_name(newname))

          # Dependency/runtime baseline.
          p = root/'archipam/package.json'
          d = json.loads(p.read_text())
          d['engines']['node'] = '^22.19.0 || >=24.0.0 <25'
          d['overrides']['fast-uri'] = '3.1.6'
          p.write_text(json.dumps(d, indent=2) + '\n')

          p = root/'archipam/package-lock.json'
          d = json.loads(p.read_text())
          d['name'] = 'archipam'
          d['packages']['']['name'] = 'archipam'
          d['packages']['']['engines']['node'] = '^22.19.0 || >=24.0.0 <25'
          fu = d['packages']['node_modules/ajv/node_modules/fast-uri']
          fu['version'] = '3.1.6'
          fu['resolved'] = 'https://registry.npmjs.org/fast-uri/-/fast-uri-3.1.6.tgz'
          fu['integrity'] = 'sha512-7Ical1vFEMr0onbVzEDIreM22I4khW+fzyQPwvAFWBp1iwdshSZRsL4jjRvPG9JP1uiqMHRto+YU6R2/CzDz5Q=='
          p.write_text(json.dumps(d, indent=2) + '\n')

          p = root/'integrations/deepseek-harness/package.json'
          d = json.loads(p.read_text())
          d['engines']['node'] = '^22.19.0 || >=24.0.0 <25'
          p.write_text(json.dumps(d, indent=2) + '\n')

          # Pin every GitHub Action used by the repo and remove EOL Node lanes.
          pins = {
              'actions/checkout@v4':'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'actions/setup-node@v4':'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4',
              'browser-actions/setup-chrome@v2':'browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0',
              'actions/configure-pages@v5':'actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5',
              'actions/upload-pages-artifact@v4':'actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4',
              'actions/deploy-pages@v4':'actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4',
              'softprops/action-gh-release@v2':'softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2',
              'pnpm/action-setup@v4':'pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4',
          }
          for p in (root/'.github/workflows').glob('*.yml'):
              if p.name == 'archipam-one-time-refactor.yml':
                  continue
              s = p.read_text()
              for a, b in pins.items():
                  s = s.replace(a, b)
              s = s.replace('node-version: [18, 20, 22, 24]', 'node-version: [22.19.0, 24]')
              s = s.replace('node-version: 22', 'node-version: 24')
              if p.name == 'ci.yml':
                  marker = '  zip-freshness:\n'
                  pos = s.find(marker)
                  if pos >= 0:
                      end = s.find('\n  published-update-manifest:', pos)
                      block = s[pos:end].replace('node-version: 24', 'node-version: 22.19.0', 1)
                      s = s[:pos] + block + s[end:]
              if p.name == 'release.yml':
                  s = s.replace('node-version: 24', 'node-version: 22.19.0', 1)
              lines = s.splitlines()
              out = []
              for line in lines:
                  if 'ARCHIPAM_CHROME_NO_SANDBOX:' in line:
                      if out and out[-1].strip() == 'env:':
                          out.pop()
                      continue
                  out.append(line)
              s = '\n'.join(out) + '\n'
              if p.name in {'ci.yml','dsh.yml'} and '\npermissions:' not in s.split('\njobs:',1)[0]:
                  s = s.replace('\njobs:\n', '\npermissions:\n  contents: read\n\njobs:\n', 1)
              p.write_text(s)

          # Add a dependency advisory gate to CI.
          p = root/'.github/workflows/ci.yml'
          s = p.read_text()
          needle = "      - name: Golden-file + schema tests\n        run: npm test\n        working-directory: archipam\n"
          if 'Dependency vulnerability gate' not in s:
              s = s.replace(needle, "      - name: Dependency vulnerability gate\n        run: npm audit --audit-level=high\n        working-directory: archipam\n" + needle, 1)
          p.write_text(s)

          # Remove Google Fonts network calls from generated/static HTML and templates.
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_ext:
                  continue
              try:
                  s = p.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              old = s
              s = re.sub(r'\s*<noscript>\s*<link href="https://fonts\.googleapis\.com[^>]*>\s*</noscript>\s*', '\n', s, flags=re.S)
              s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*', '\n', s)
              s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*', '\n', s)
              s = re.sub(r'\s*<link href="https://fonts\.googleapis\.com[^>]*>\s*', '\n', s, flags=re.S)
              s = s.replace('https://fonts.googleapis.com', 'about:blank#remote-font-removed')
              s = s.replace('https://fonts.gstatic.com', 'about:blank#remote-font-removed')
              s = s.replace('  <!-- Async font load: a blackholed network must not block first paint.\n       The body font stack falls back to system monospace until it lands. -->\n', '  <!-- Offline-safe font policy: use the local/system monospace stack only. -->\n')
              if s != old:
                  p.write_text(s, 'utf-8')

          # Sanitize renderer failures so CLI users do not receive internal stack traces/paths.
          p = root/'archipam/bin/archipam.mjs'
          s = p.read_text()
          old = """function commandRender(args) {
            const qualityArgs = extractQualityArgs(args);
            const repoArgs = extractRepoRootArgs(qualityArgs.rest);
            const [type, input, output] = repoArgs.rest;
            if (!type || !input) fail(usage());
            assertEvidenceType(type, repoArgs.repoRoot);
            const result = runNode([rendererPath(type), input, ...(output ? [output] : [])], {
              env: rendererEnv(qualityArgs.quality, repoArgs.repoRoot),
            });
            if (result.status !== 0) exitFrom(result);
          }
          """
          new = """function commandRender(args) {
            const qualityArgs = extractQualityArgs(args);
            const repoArgs = extractRepoRootArgs(qualityArgs.rest);
            const [type, input, output] = repoArgs.rest;
            if (!type || !input) fail(usage());
            assertEvidenceType(type, repoArgs.repoRoot);
            const result = runNode([rendererPath(type), input, ...(output ? [output] : [])], {
              stdio: 'pipe',
              env: rendererEnv(qualityArgs.quality, repoArgs.repoRoot, true),
            });
            if (result.status !== 0) {
              const failure = rendererFailure(result);
              reportArtifactFailure({
                command: 'render',
                json: false,
                stage: failure.diagnostics.some((entry) => entry.code.startsWith('input/')) ? 'input' : 'render',
                type,
                input: path.resolve(input),
                ...(output ? { output: path.resolve(output) } : {}),
                error: failure.error,
                diagnostics: failure.diagnostics,
                status: result.status ?? 1,
              });
              return;
            }
            if (result.stdout) process.stdout.write(result.stdout);
          }
          """
          if old not in s:
              raise RuntimeError('commandRender block not found')
          s = s.replace(old, new)
          s = s.replace("  const nodeMajor = Number.parseInt(process.versions.node.split('.')[0], 10);\n  checks.push({\n    label: `Node.js v${process.versions.node} (requires >=18)`,\n    ok: nodeMajor >= 18,\n", "  const [nodeMajor, nodeMinor] = process.versions.node.split('.').map(Number);\n  const nodeSupported = (nodeMajor === 22 && nodeMinor >= 19) || nodeMajor === 24;\n  checks.push({\n    label: `Node.js v${process.versions.node} (requires Node 22.19+ or 24.x)`,\n    ok: nodeSupported,\n")
          s = s.replace('Node.js 18 or newer is required', 'Node.js 22.19+ or Node.js 24.x is required')
          p.write_text(s)

          # Update tests that intentionally enforce the supported Node lanes.
          p = root/'archipam/test/release-package-gates.test.mjs'
          s = p.read_text().replace("assert.equal(packageJson.engines?.node, '>=18');", "assert.equal(packageJson.engines?.node, '^22.19.0 || >=24.0.0 <25');")
          old = """  const versions = testJob.match(/node-version:\\s*\\[([^\\]]+)\\]/)?.[1]
            .split(',')
            .map((version) => Number(version.trim()));
          assert.ok(versions, 'test job must declare an explicit Node version matrix');
          for (const version of [18, 20, 22, 24]) {
            assert.ok(versions.includes(version), `test matrix must cover Node ${version}`);
          }
          """
          new = """  const versions = testJob.match(/node-version:\\s*\\[([^\\]]+)\\]/)?.[1]
            .split(',')
            .map((version) => version.trim());
          assert.ok(versions, 'test job must declare an explicit Node version matrix');
          for (const version of ['22.19.0', '24']) {
            assert.ok(versions.includes(version), `test matrix must cover maintained Node ${version}`);
          }
          for (const eolVersion of ['18', '20']) {
            assert.equal(versions.includes(eolVersion), false, `test matrix must not advertise EOL Node ${eolVersion}`);
          }
          """
          if old not in s:
              raise RuntimeError('Node matrix contract block not found')
          p.write_text(s.replace(old, new))

          # Prove textual/path rename completeness before tests.
          legacy_paths = [str(p) for p in root.rglob('*') if '.git' not in p.parts and 'archify' in p.name.lower()]
          legacy_text = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_ext:
                  continue
              try:
                  text = p.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              if 'archify' in text.lower():
                  legacy_text.append(str(p))
          if legacy_paths or legacy_text:
              raise RuntimeError(f'legacy product references remain: paths={legacy_paths[:10]} text={legacy_text[:10]}')
          PY

          # The source archive must be rebuilt after the rename.
          rm -f archipam.zip
          git add -A
          scripts/build-zip.sh archipam.zip
          git add archipam.zip

      - name: Install dependencies
        run: npm ci
        working-directory: archipam
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: archipam
      - name: Full test suite
        run: npm test
        working-directory: archipam
      - name: Package smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/archipam-package"
          rm -rf "$root"
          mkdir -p "$root"
          unzip -q archipam.zip -d "$root"
          node scripts/package-smoke.mjs "$root/archipam"
      - name: Verify stack traces are redacted
        shell: bash
        run: |
          set -euo pipefail
          printf '{bad json' > "$RUNNER_TEMP/bad.json"
          set +e
          node archipam/bin/archipam.mjs render architecture "$RUNNER_TEMP/bad.json" "$RUNNER_TEMP/out.html" 2> "$RUNNER_TEMP/error.log"
          status=$?
          set -e
          test "$status" -ne 0
          ! grep -Eq 'file:///|[[:space:]]at[[:space:]].*\(' "$RUNNER_TEMP/error.log"
      - name: Commit refactor result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/archipam-one-time-refactor.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: rename Archify to Archipam and harden security'
          git push origin HEAD:security/archipam-hardening
