# External validation trigger after materialized ArchiPam migration
# Final validation trigger: run all migration, security, packaging and browser gates.
# Validation trigger 2026-09-06
name: Temporary ArchiPam repair

on:
  push:
    branches:
      - security/archipam-hardening
    paths:
      - '.github/archipam-repair.py'
      - '.github/workflows/archipam-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: archipam/package-lock.json
      - name: Provision Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install GIF/WebM decoder
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Apply migration gate repairs
        run: python .github/archipam-repair.py

      - name: Restore executable build entrypoint
        shell: bash
        run: |
          chmod +x scripts/build-zip.sh
          git add --chmod=+x scripts/build-zip.sh
          git add -A

      - name: Refresh lock and install
        working-directory: archipam
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high

      - name: Regenerate architecture delta proof
        shell: bash
        run: |
          node archipam/bin/archipam.mjs compare architecture \
            archipam/examples/checkout-platform.base.architecture.json \
            archipam/examples/checkout-platform.head.architecture.json \
            examples/checkout-platform-delta.html \
            --receipt examples/checkout-platform-delta.receipt.json \
            --quality showcase --json >/tmp/archipam-delta.json

      - name: Persist migration gate repairs
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair ArchiPam migration gates'
            git push origin HEAD:security/archipam-hardening
          fi

      - name: Regenerate checked documentation
        working-directory: archipam
        env:
          ARCHIPAM_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIPAM_CHROME_NO_SANDBOX: '1'
        run: |
          npm run render:examples
          npm run build:gallery
          npm run build:guide
          npm run build:start
          npm run build:readme-showcase

      - name: Build deterministic archive twice
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          scripts/build-zip.sh /tmp/archipam-a.zip
          scripts/build-zip.sh /tmp/archipam-b.zip
          cmp -s /tmp/archipam-a.zip /tmp/archipam-b.zip
          cp /tmp/archipam-a.zip archipam.zip
          git add archipam.zip

      - name: Persist generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh ArchiPam deterministic artifacts'
            git push origin HEAD:security/archipam-hardening
          fi

      - name: Full core suite
        working-directory: archipam
        run: npm test

      - name: WebM and browser smoke
        working-directory: archipam
        env:
          ARCHIPAM_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          ARCHIPAM_CHROME_NO_SANDBOX: '1'
        run: |
          npm run test:webm
          node --test test/desktop-reader-browser.test.mjs test/i18n.test.mjs test/semantic-radar.test.mjs test/viewer-chrome-layout.test.mjs

      - name: DSH contracts
        run: node --test integrations/deepseek-harness/test/*.test.mjs

      - name: Package smoke and renderer error privacy
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/archipam-package"
          mkdir -p "$package_root"
          unzip -q archipam.zip -d "$package_root"
          node scripts/package-smoke.mjs "$package_root/archipam"
          printf '{bad json' > "$RUNNER_TEMP/bad.json"
          set +e
          node archipam/bin/archipam.mjs render architecture "$RUNNER_TEMP/bad.json" "$RUNNER_TEMP/out.html" 2> "$RUNNER_TEMP/error.log"
          status=$?
          set -e
          test "$status" -ne 0
          ! grep -Eq 'file:///|[[:space:]]at[[:space:]].*\(' "$RUNNER_TEMP/error.log"

      - name: Verify no legacy product identity outside temporary repair files
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -i archify -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.gif' ':!*.webm' ':!*.zip' ':!.github/archipam-repair.py' ':!.github/workflows/archipam-repair.yml'; then
            echo '::error::legacy product identity remains'
            exit 1
          fi
