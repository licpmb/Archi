name: One-time Archipam security refactor v2

on:
  push:
    branches:
      - security/archipam-hardening

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: archify/package-lock.json

      - name: Rename product and apply security hardening
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          temp_workflows = {'archipam-one-time-refactor.yml', 'archipam-refactor-v2.yml'}
          binary_ext = {'.png','.jpg','.jpeg','.gif','.webm','.ico','.zip','.woff','.woff2','.ttf','.otf','.pdf'}
          special = [
              ('@tt-a1i/archify-dsh','@licpmb/archipam-dsh'),
              ('https://github.com/tt-a1i/archify.git','https://github.com/licpmb/Archi.git'),
              ('https://github.com/tt-a1i/archify','https://github.com/licpmb/Archi'),
              ('https://tt-a1i.github.io/archify','https://licpmb.github.io/Archi'),
              ('tt-a1i/archify','licpmb/Archi'),
          ]
          replacements = [('ARCHIFY','ARCHIPAM'),('Archify','Archipam'),('archify','archipam')]

          # Product rename across every UTF-8 source/config/doc file. Temporary workflows
          # are excluded because they deliberately contain the legacy spelling as input data.
          for p in list(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_ext or p.name in temp_workflows:
                  continue
              try:
                  s = p.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              old = s
              for a, b in special:
                  s = s.replace(a, b)
              for a, b in replacements:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s, 'utf-8')

          # Rename every tracked/untracked path that contains the old product name.
          items = [p for p in root.rglob('*') if '.git' not in p.parts and 'archify' in p.name.lower()]
          for p in sorted(items, key=lambda x: len(x.parts), reverse=True):
              if not p.exists():
                  continue
              newname = p.name.replace('ARCHIFY','ARCHIPAM').replace('Archify','Archipam').replace('archify','archipam')
              if newname != p.name:
                  p.rename(p.with_name(newname))

          # Supported runtime and vulnerable transitive override.
          package_path = root/'archipam/package.json'
          package = json.loads(package_path.read_text())
          package['engines']['node'] = '^22.19.0 || >=24.0.0 <25'
          package['overrides']['fast-uri'] = '3.1.6'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          harness_path = root/'integrations/deepseek-harness/package.json'
          harness = json.loads(harness_path.read_text())
          harness['engines']['node'] = '^22.19.0 || >=24.0.0 <25'
          harness_path.write_text(json.dumps(harness, indent=2) + '\n')

          # Pin third-party Actions, remove EOL Node lanes, and keep the canonical ZIP
          # builder on maintained Node 22 because archive bytes are intentionally bound to major 22.
          pins = {
              'actions/checkout@v4':'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'actions/setup-node@v4':'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4',
              'browser-actions/setup-chrome@v2':'browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0',
              'actions/configure-pages@v5':'actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5',
              'actions/upload-pages-artifact@v4':'actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4',
              'actions/deploy-pages@v4':'actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4',
              'softprops/action-gh-release@v2':'softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2',
              'pnpm/action-setup@v4':'pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4',
          }
          for p in (root/'.github/workflows').glob('*.yml'):
              if p.name in temp_workflows:
                  continue
              s = p.read_text()
              for a, b in pins.items():
                  s = s.replace(a, b)
              s = s.replace('node-version: [18, 20, 22, 24]', 'node-version: [22.19.0, 24]')
              # Remaining fixed lanes can run current LTS.
              s = re.sub(r'node-version:\s*22\s*$', 'node-version: 24', s, flags=re.M)
              if p.name == 'ci.yml':
                  # Deterministic archive rebuild must stay on the canonical Node 22 major.
                  s = re.sub(
                      r'(  zip-freshness:\n.*?node-version:) 24',
                      r'\1 22.19.0',
                      s,
                      count=1,
                      flags=re.S,
                  )
              if p.name == 'release.yml':
                  s = re.sub(r'node-version: 24', 'node-version: 22.19.0', s, count=1)
              # GitHub-hosted Chrome can retain its sandbox; remove the opt-out from CI.
              lines = s.splitlines()
              out = []
              for line in lines:
                  if 'ARCHIPAM_CHROME_NO_SANDBOX:' in line:
                      if out and out[-1].strip() == 'env:':
                          out.pop()
                      continue
                  out.append(line)
              s = '\n'.join(out) + '\n'
              if p.name in {'ci.yml','dsh.yml'} and '\npermissions:' not in s.split('\njobs:',1)[0]:
                  s = s.replace('\njobs:\n', '\npermissions:\n  contents: read\n\njobs:\n', 1)
              p.write_text(s)

          # Dependency advisory gate in the main CI test job.
          ci = root/'.github/workflows/ci.yml'
          s = ci.read_text()
          needle = "      - name: Golden-file + schema tests\n        run: npm test\n        working-directory: archipam\n"
          if 'Dependency vulnerability gate' not in s:
              if needle not in s:
                  raise RuntimeError('CI test insertion point not found')
              s = s.replace(needle, "      - name: Dependency vulnerability gate\n        run: npm audit --audit-level=high\n        working-directory: archipam\n" + needle, 1)
          ci.write_text(s)

          # Remove external Google Fonts calls from shipped/generated HTML.
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_ext or p.name in temp_workflows:
                  continue
              try:
                  s = p.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              old = s
              s = re.sub(r'\s*<noscript>\s*<link href="https://fonts\.googleapis\.com[^>]*>\s*</noscript>\s*', '\n', s, flags=re.S)
              s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*', '\n', s)
              s = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*', '\n', s)
              s = re.sub(r'\s*<link href="https://fonts\.googleapis\.com[^>]*>\s*', '\n', s, flags=re.S)
              s = s.replace('https://fonts.googleapis.com', 'about:blank#remote-font-removed')
              s = s.replace('https://fonts.gstatic.com', 'about:blank#remote-font-removed')
              s = s.replace(
                  '  <!-- Async font load: a blackholed network must not block first paint.\n       The body font stack falls back to system monospace until it lands. -->\n',
                  '  <!-- Offline-safe font policy: use the local/system monospace stack only. -->\n',
              )
              if s != old:
                  p.write_text(s, 'utf-8')

          # Route renderer failures through the existing diagnostic redaction path.
          cli = root/'archipam/bin/archipam.mjs'
          s = cli.read_text()
          pattern = re.compile(
              r"function commandRender\(args\) \{\n"
              r"  const qualityArgs = extractQualityArgs\(args\);\n"
              r"  const repoArgs = extractRepoRootArgs\(qualityArgs\.rest\);\n"
              r"  const \[type, input, output\] = repoArgs\.rest;\n"
              r"  if \(!type \|\| !input\) fail\(usage\(\)\);\n"
              r"  assertEvidenceType\(type, repoArgs\.repoRoot\);\n"
              r"  const result = runNode\(\[rendererPath\(type\), input, \.\.\.\(output \? \[output\] : \[\]\)\], \{\n"
              r"    env: rendererEnv\(qualityArgs\.quality, repoArgs\.repoRoot\),\n"
              r"  \}\);\n"
              r"  if \(result\.status !== 0\) exitFrom\(result\);\n"
              r"\}",
          )
          replacement = """function commandRender(args) {
            const qualityArgs = extractQualityArgs(args);
            const repoArgs = extractRepoRootArgs(qualityArgs.rest);
            const [type, input, output] = repoArgs.rest;
            if (!type || !input) fail(usage());
            assertEvidenceType(type, repoArgs.repoRoot);
            const result = runNode([rendererPath(type), input, ...(output ? [output] : [])], {
              stdio: 'pipe',
              env: rendererEnv(qualityArgs.quality, repoArgs.repoRoot, true),
            });
            if (result.status !== 0) {
              const failure = rendererFailure(result);
              reportArtifactFailure({
                command: 'render',
                json: false,
                stage: failure.diagnostics.some((entry) => entry.code.startsWith('input/')) ? 'input' : 'render',
                type,
                input: path.resolve(input),
                ...(output ? { output: path.resolve(output) } : {}),
                error: failure.error,
                diagnostics: failure.diagnostics,
                status: result.status ?? 1,
              });
              return;
            }
            if (result.stdout) process.stdout.write(result.stdout);
          }"""
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise RuntimeError(f'commandRender patch count was {n}')

          old_doctor = """  const nodeMajor = Number.parseInt(process.versions.node.split('.')[0], 10);
            checks.push({
              label: `Node.js v${process.versions.node} (requires >=18)`,
              ok: nodeMajor >= 18,
          """
          if old_doctor in s:
              s = s.replace(old_doctor, """  const [nodeMajor, nodeMinor] = process.versions.node.split('.').map(Number);
            const nodeSupported = (nodeMajor === 22 && nodeMinor >= 19) || nodeMajor === 24;
            checks.push({
              label: `Node.js v${process.versions.node} (requires Node 22.19+ or 24.x)`,
              ok: nodeSupported,
          """, 1)
          else:
              # Whitespace-tolerant doctor replacement.
              s, doctor_n = re.subn(
                  r"  const nodeMajor = Number\.parseInt\(process\.versions\.node\.split\('\.'\)\[0\], 10\);\n  checks\.push\(\{\n    label: `Node\.js v\$\{process\.versions\.node\} \(requires >=18\)`,\n    ok: nodeMajor >= 18,",
                  "  const [nodeMajor, nodeMinor] = process.versions.node.split('.').map(Number);\n  const nodeSupported = (nodeMajor === 22 && nodeMinor >= 19) || nodeMajor === 24;\n  checks.push({\n    label: `Node.js v${process.versions.node} (requires Node 22.19+ or 24.x)`,\n    ok: nodeSupported,",
                  s,
                  count=1,
              )
              if doctor_n != 1:
                  raise RuntimeError(f'doctor Node patch count was {doctor_n}')
          s = s.replace('Node.js 18 or newer is required', 'Node.js 22.19+ or Node.js 24.x is required')
          cli.write_text(s)

          # Update test contracts for maintained runtime lanes and pinned actions.
          gates = root/'archipam/test/release-package-gates.test.mjs'
          s = gates.read_text()
          s = s.replace("assert.equal(packageJson.engines?.node, '>=18');", "assert.equal(packageJson.engines?.node, '^22.19.0 || >=24.0.0 <25');")
          s = s.replace('.map((version) => Number(version.trim()));', '.map((version) => version.trim());')
          s, matrix_n = re.subn(
              r"  for \(const version of \[18, 20, 22, 24\]\) \{\n    assert\.ok\(versions\.includes\(version\), `test matrix must cover Node \$\{version\}`\);\n  \}",
              "  for (const version of ['22.19.0', '24']) {\n    assert.ok(versions.includes(version), `test matrix must cover maintained Node ${version}`);\n  }\n  for (const eolVersion of ['18', '20']) {\n    assert.equal(versions.includes(eolVersion), false, `test matrix must not advertise EOL Node ${eolVersion}`);\n  }",
              s,
              count=1,
          )
          if matrix_n != 1:
              raise RuntimeError(f'Node matrix test patch count was {matrix_n}')
          s = s.replace('assert.match(packageSmokeJob, /node-version:\\s*22/);', "assert.match(packageSmokeJob, /node-version:\\s*24/);")
          pinned_test_patterns = {
              'actions\\/configure-pages@v5':'actions\\/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b',
              'actions\\/upload-pages-artifact@v4':'actions\\/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b',
              'actions\\/deploy-pages@v4':'actions\\/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e',
          }
          for a, b in pinned_test_patterns.items():
              s = s.replace(a, b)
          gates.write_text(s)

          # No textual or path-level legacy product identifiers may remain outside the
          # two temporary transformation workflows that are deleted before commit.
          legacy_paths = [str(p) for p in root.rglob('*') if '.git' not in p.parts and p.name not in temp_workflows and 'archify' in p.name.lower()]
          legacy_text = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() in binary_ext or p.name in temp_workflows:
                  continue
              try:
                  text = p.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              if 'archify' in text.lower():
                  legacy_text.append(str(p))
          if legacy_paths or legacy_text:
              raise RuntimeError(f'legacy product references remain: paths={legacy_paths[:10]} text={legacy_text[:10]}')
          PY

          # Let npm regenerate lock metadata for the patched override instead of hand-editing it.
          npm install --package-lock-only --ignore-scripts
          rm -f ../archipam.zip
          git add -A
          cd ..
          scripts/build-zip.sh archipam.zip
          git add archipam.zip
        working-directory: archify

      - name: Install dependencies
        run: npm ci
        working-directory: archipam
      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: archipam
      - name: Full test suite
        run: npm test
        working-directory: archipam
      - name: Package smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/archipam-package"
          rm -rf "$root"
          mkdir -p "$root"
          unzip -q archipam.zip -d "$root"
          node scripts/package-smoke.mjs "$root/archipam"
      - name: Verify stack traces are redacted
        shell: bash
        run: |
          set -euo pipefail
          printf '{bad json' > "$RUNNER_TEMP/bad.json"
          set +e
          node archipam/bin/archipam.mjs render architecture "$RUNNER_TEMP/bad.json" "$RUNNER_TEMP/out.html" 2> "$RUNNER_TEMP/error.log"
          status=$?
          set -e
          test "$status" -ne 0
          ! grep -Eq 'file:///|[[:space:]]at[[:space:]].*\(' "$RUNNER_TEMP/error.log"
      - name: Commit refactor result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/archipam-one-time-refactor.yml .github/workflows/archipam-refactor-v2.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: rename Archify to Archipam and harden security'
          git push origin HEAD:security/archipam-hardening
